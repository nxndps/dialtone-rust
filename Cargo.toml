[workspace]
members = [
    "dialtone",
    "dialtone-demo",
    "dialtone-demo/split-tool",
    "examples/hello-world",
    "examples/hello-tauri",
    "examples/hello-tauri/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
getrandom = "0.3"
js-sys = "0.3.81"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.104"
wasm-bindgen-cli-support = "0.2.104"
wasm-bindgen-futures = "0.4.54"
wasm_split_cli_support = "0.2"
web-sys = "0.3.81"
