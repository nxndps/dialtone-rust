[package]
name = "hello-tauri"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tauri 2 shell for the Hello Dialtone app"

[lib]
# The lib name has to differ from the package binary on Windows.
# https://github.com/rust-lang/cargo/issues/8519
name = "hello_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.3"
