# Applies when Cargo runs from this directory, which is how Trunk builds.
# The host linker is scripts/zig-cc. The wasm target keeps rust-lld.
# SDKROOT stops rustc from calling xcrun. Leave
# CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER unset.

[target.aarch64-apple-darwin]
linker = "scripts/zig-cc"

[target.x86_64-apple-darwin]
linker = "scripts/zig-cc"

[env]
SDKROOT = { value = "/", force = true, relative = false }
